<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <script>
      // Resolve the theme before styles and React load to avoid a flash on return visits.
      (() => {
        const root = document.documentElement;
        const preview = new URLSearchParams(location.search).get('preview') !== 'legacy';
        root.classList.toggle('revision-preview', preview);
        let saved;
        try {
          saved = localStorage.getItem('portfolio.theme.v1');
        } catch {}
        const theme = saved === 'light' ? 'light' : 'dark';
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        const background = preview
          ? theme === 'dark'
            ? '#141414'
            : '#f5f5f3'
          : theme === 'dark'
            ? '#191c18'
            : '#f7f6f2';
        root.style.backgroundColor = background;
        document.querySelector('meta[name="theme-color"]').content = background;
      })();
    </script>
    <meta
      name="description"
      content="Augusto Gonzalez — Senior full-stack engineer with deep React Native experience. Explore mobile products and the systems behind them."
    />
    <meta property="og:title" content="Augusto Gonzalez — From interface to infrastructure" />
    <meta
      property="og:description"
      content="An interactive portfolio of mobile products and full-stack engineering."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://augustoalegon.github.io/" />
    <meta property="og:image" content="https://augustoalegon.github.io/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Augusto Gonzalez — Full-stack engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >This portfolio includes interactive demos. Enable JavaScript to explore them. Contact Augusto
      at augustogonzalez.dev@gmail.com or download
      <a href="/cv/augusto-gonzalez-fullstack.pdf">the CV</a>.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
